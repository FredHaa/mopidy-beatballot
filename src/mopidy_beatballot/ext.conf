[beatballot]
enabled = true
# standalone: one party, music plays on this machine.
# hub: hosts many parties; music plays on paired remote players.
# player: a remote player that plays what its hub sends.
mode = standalone
# Standalone: the party's name
party_name = Beat Ballot
# Hub: PIN of the hub owner (create parties, pair players, Tidal login)
hub_pin =
# Player: the hub's address, e.g. https://www.klubhuset.party
hub_url =
# Player: one-time pairing code from the hub page (only needed once)
pair_code =
# Player: name shown on the hub
player_name =
# Playlists the random candidates come from: Mopidy URIs or share links from
# Spotify, Tidal or SoundCloud, separated by commas or newlines. Picks are
# drawn at random from all their songs combined. Leave empty to vote only on
# songs guests add.
playlists =
# PIN guests enter to join the party
pin = 1234
# PIN for the host panel (skip, pause, test mode, change playlist). Empty disables it.
admin_pin =
# Random playlist tracks offered each round
candidates = 3
# Voting locks this many seconds before the current song ends
lock_before_end = 20
# Whether losing songs with votes carry over to the next round (host can toggle)
carry_over = true
# Losing songs with at least this many votes carry over to the next round
carry_min_votes = 2
# Songs each guest may add via search per round
max_suggestions_per_user = 1
# URI schemes searched for suggestions (e.g. spotify, tidal, soundcloud);
# empty searches every enabled backend
search_schemes =
# URL guests use to join, shown as a QR code on the host screen
public_url =
# Reverse proxies (IPs/CIDRs, e.g. Traefik and Cloudflare) whose X-Forwarded-For
# header is trusted, so PIN rate limiting sees each guest's real IP
trusted_proxies =
# Test mode: play only the first test_play_seconds of each song, lock at test_lock_at
test_mode = false
test_play_seconds = 30
test_lock_at = 15
