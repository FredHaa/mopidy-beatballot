[project]
name = "mopidy-beatballot"
version = "0.1.0"
description = "Mopidy extension where party guests vote on the next song"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Frederik Haarslev" }]
keywords = ["mopidy", "party", "voting", "jukebox", "spotify", "tidal", "soundcloud"]
dependencies = [
    "mopidy>=4.0.4",
    "mopidy-spotify>=5.0.1",
    "mopidy-tidal>=0.3.13",
    "mopidy-soundcloud>=4.0.0",
    "pykka>=4.1",
    "tornado>=6.4.2",
]

[project.urls]
Repository = "https://github.com/FredHaa/mopidy-beatballot"

[project.entry-points."mopidy.ext"]
beatballot = "mopidy_beatballot:Extension"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mopidy_beatballot"]
# The Svelte build output is gitignored but must ship in the wheel.
artifacts = ["src/mopidy_beatballot/static/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/mopidy_beatballot/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
