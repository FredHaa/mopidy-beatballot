# Beat Ballot player settings. Values with spaces need quotes.
# After editing: sudo systemctl restart beatballot-player
#   (user service: systemctl --user restart beatballot-player)

# The hub's address, e.g. https://www.klubhuset.party
HUB_URL=""

# One-time code from the hub page (Pair player). Easiest: beatballot-player pair CODE
PAIR_CODE=""

# Name shown on the hub page (default: this machine's hostname)
PLAYER_NAME=""

# Sound output (GStreamer sink). Find cards with `aplay -l`.
#   alsasink                        the default sound card (headless machines)
#   "alsasink device=hw:Headphones" a Raspberry Pi's 3.5 mm jack
#   "alsasink device=hw:1,0"        a USB DAC
#   pulsesink                       desktops with PipeWire/PulseAudio (user service)
AUDIO_OUTPUT="alsasink"
MIXER_VOLUME=80

# Local port of the player's status page (only reachable from this machine)
HTTP_PORT=6680
