name: Release

# Push a tag like v0.2.0 (matching pyproject.toml's version) to publish:
# - a GitHub Release with the beatballot-player .deb packages (amd64, arm64),
#   the Python wheel and the source package
# - the wheel and sdist on PyPI, if the repository variable PYPI_PUBLISH is
#   "true" and PyPI trusted publishing is set up for this workflow
# The Docker image is tagged with the version by ci.yml.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME doesn't match pyproject.toml version $version" >&2
            exit 1
          }
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: docker/setup-qemu-action@v3
      - name: Web app, wheel and .deb packages
        run: sh packaging/deb/build.sh amd64 arm64
      - name: Source package
        run: uv build --sdist --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.whl
            dist/*.tar.gz

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
